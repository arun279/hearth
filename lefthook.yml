prepare-commit-msg:
  commands:
    refuse-amend:
      # Git invokes this hook with three args when --amend (or -c/-C) is
      # used: $1=path-to-COMMIT_EDITMSG, $2="commit", $3=<sha or HEAD>.
      # `--amend` specifically passes "HEAD" as $3, so the predicate
      # below distinguishes amend from -c/-C/cherry-pick which all
      # share source="commit" but pass a real ref SHA. Override with
      # `HEARTH_ALLOW_AMEND=1` when fixing a typo in an unpushed local
      # commit you just made — same shape as `--no-verify`. Agents
      # MUST NOT use the override without explicit maintainer approval
      # (see AGENTS.md § Authoring discipline).
      run: |
        if [ "{2}" = "commit" ] && [ "{3}" = "HEAD" ]; then
          if [ "$HEARTH_ALLOW_AMEND" != "1" ]; then
            echo ""
            echo "✗ git commit --amend is blocked by lefthook."
            echo ""
            echo "  Reviewed PR commits don't get amended — make a new"
            echo "  commit on top with the fix message instead."
            echo ""
            echo "  Override (typo in an unpushed local commit only):"
            echo "    HEARTH_ALLOW_AMEND=1 git commit --amend ..."
            echo ""
            echo "  Agents: explicit maintainer approval required,"
            echo "  same as --no-verify."
            exit 1
          fi
        fi

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
      run: pnpm biome check --staged --no-errors-on-unmatched --write {staged_files}
      stage_fixed: true
    dprint:
      glob: "*.md"
      run: pnpm exec dprint fmt {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      # Full turbo typecheck — cache makes incremental runs near-instant.
      # `--filter "...[HEAD]"` would be more targeted but breaks on the
      # first commit where HEAD doesn't exist yet.
      run: pnpm typecheck
    # TODO(scaffolding): wire a secrets scanner here once we've picked one.
    # `pnpm dlx trufflehog@latest` pulls a bogus npm package (the real Go
    # trufflehog isn't on npm). CI's .github/workflows/security.yml already
    # runs trufflesecurity/trufflehog (the real Go tool) on every PR, so we
    # have CI-side coverage. Gitleaks via a pinned binary is the likely
    # replacement for the pre-commit side.
    env-example:
      glob: "**/.dev.vars.example"
      run: pnpm check:env-example

pre-push:
  parallel: true
  commands:
    refuse-force-push:
      # Force-push (and --force-with-lease) rewrites the remote ref;
      # reviewers lose track of what changed since their last review,
      # CI history pointers go stale, and a teammate's in-flight work
      # rebased on the prior tip can be silently overwritten. Detect
      # via the parent process's command line — the only client-side
      # signal that survives, since the wire protocol can't tell
      # `--force` from `--force-with-lease` (per Git docs). Override
      # with `HEARTH_ALLOW_FORCE_PUSH=1` for legitimate cases (rare:
      # personal feature branch with no reviewers, never main).
      # Agents MUST NOT use the override without explicit maintainer
      # approval (see AGENTS.md § Authoring discipline).
      run: |
        cmd=$(ps -ocommand= -p $PPID 2>/dev/null || true)
        if echo "$cmd" | grep -qE -- '(--force|--force-with-lease|(^| )-f( |$))'; then
          if [ "$HEARTH_ALLOW_FORCE_PUSH" != "1" ]; then
            echo ""
            echo "✗ force-push is blocked by lefthook."
            echo ""
            echo "  Detected: $cmd"
            echo ""
            echo "  Force-pushing rewrites remote history; reviewers"
            echo "  lose track of what changed since their last review."
            echo "  Make a new commit on top instead."
            echo ""
            echo "  Override (your own feature branch, no reviewers):"
            echo "    HEARTH_ALLOW_FORCE_PUSH=1 git push --force ..."
            echo ""
            echo "  Agents: explicit maintainer approval required."
            exit 1
          fi
        fi
    biome:
      # Belt-and-suspenders: if pre-commit's staged-file run was skipped
      # (LEFTHOOK=0) or missed anything via glob edge cases, this re-runs
      # biome on the full repo before the code leaves the machine.
      run: pnpm biome check .
    dprint:
      run: pnpm check:md
    test:
      # Full turbo test run — cache makes incremental runs fast. Using
      # `--filter "...[HEAD]"` would be more targeted but breaks when HEAD
      # isn't the branch tip (e.g., detached HEAD, rebase in progress).
      run: pnpm test
    arch:
      run: pnpm check:arch
    knip:
      run: pnpm check:knip
    conventions:
      run: pnpm check:conventions
    dup:
      run: pnpm check:dup
    policy-purity:
      glob: "packages/domain/src/(policy|visibility)/**/*.ts"
      run: pnpm --filter @hearth/domain test -- --run policy-purity
    # `db-check-auth` (Better Auth schema-drift guard via `pnpm dlx
    # @better-auth/cli`) is intentionally NOT in the pre-push pool. Under
    # parallel-pool memory pressure on small dev VMs, the dlx-spawned Node
    # + jiti TS-loader pipeline GC-thrashes on cold caches and never
    # progresses (observed: 7+ min CPU time for a 1.7s standalone run).
    # CI runs the same check on every PR via .github/workflows/ci.yml, so
    # local removal is safe — the gate still enforces server-side.
    test-integration:
      run: pnpm test:integration
    coverage:
      run: pnpm check:coverage
    e2e:
      run: pnpm --filter @hearth/web e2e
    audit:
      run: pnpm audit --audit-level=high
    licenses:
      run: pnpm check:licenses
    resolution:
      run: pnpm install --resolution-only
